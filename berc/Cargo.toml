[package]
name = "berc"
description = "better_erc command line: checks for CI (text, JSON, SARIF, Markdown, baselines), the check catalogue, readable git diffs of KiCad files (textconv)"
authors.workspace = true
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
include.workspace = true

[features]
# The mx3 part store as the part source of `parts refresh` and `fp accept` without --from
mx3 = ["better_erc/mx3"]

[dependencies]
anstream = "1"
anstyle = "1"
clap = { version = "4.5", features = ["derive"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
indicatif = "0.18"
serde_json = "1"
better_erc = { path = "../better_erc" }


[dev-dependencies]
erc_fake_mx3 = { path = "../erc_fake_mx3" }
