[package]
name = "berc"
description = "better_erc command line: checks for CI (text, JSON, SARIF, Markdown, baselines), the check catalogue, readable git diffs of KiCad files (textconv)"
authors.workspace = true
edition.workspace = true
version.workspace = true
rust-version.workspace = true
include.workspace = true

[dependencies]
anstream = "1"
anstyle = "1"
clap = { version = "4.5", features = ["derive"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
indicatif = "0.18"
serde_json = "1"
better_erc = { path = "../better_erc" }

