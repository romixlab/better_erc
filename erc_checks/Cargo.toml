[package]
name = "erc_checks"
description = "better_erc check engine: one file per catalogue check, declared data needs, findings with provenance, reports"
authors.workspace = true
edition.workspace = true
version.workspace = true
rust-version.workspace = true
include.workspace = true
build = "build.rs"

[features]
default = ["import"]
# `project`: open a design from a path through the importer registry, the entry `berc check` and the MCP server use
import = ["dep:erc_import", "erc_model/fs"]

[dependencies]
erc_import = { path = "../erc_import", optional = true }
anstyle = "1"
erc_analysis = { path = "../erc_analysis" }
erc_model = { path = "../erc_model" }
inventory = "0.3"
rayon = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
erc_kicad = { path = "../erc_kicad" }
toml = "1"
