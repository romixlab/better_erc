[package]
name = "better_erc_app"
description = "The better_erc GUI (egui); the binary is `better_erc`"
authors.workspace = true
edition.workspace = true
version.workspace = true
rust-version.workspace = true
include.workspace = true
build = "build.rs"

[[bin]]
name = "better_erc"
path = "src/main.rs"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = [
    #"accesskit", # Make egui compatible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts", # Embed the default egui fonts.
    "wgpu", # Use the wgpu rendering backend (vhrd_egui stack), alternative: "glow".
    "persistence", # Enable restoring app state when restarting the app.
    "wayland", # To support Linux (and CI)
] }
egui-phosphor = { version = "0.14", features = ["fill"] }
egui_tiles = "0.17"
rfd = "0.15"

strum = { version = "0.27", features = ["derive"] }
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
tap = "1.0"
tokio = { version = "1.44", features = ["full", "sync"] }

hayro = { version = "0.9", default-features = false }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse", "display"] }

better_erc = { path = "../better_erc" }

# native:
[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.50"
web-sys = "0.3.70" # to access the DOM (to hide the loading text)
