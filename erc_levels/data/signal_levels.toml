[family.rs232]
name = "RS-232 (TIA/EIA-232-F)"
group = "RS-232"
kind = "bus"
standard = "TIA/EIA-232-F"
source = { doc = "TI-SLLA037", loc = "Figure 3 and text, p. 3 (PDF p. 8)" }
level = [
  { param = "VOH", min = 5.0, max = 15.0, unit = "V", cond = "driver, space = logic 0; load 3-7 kΩ", verified = true },
  { param = "VOL", min = -15.0, max = -5.0, unit = "V", cond = "driver, mark = logic 1; load 3-7 kΩ", verified = true },
  { param = "VIH", min = 3.0, max = 15.0, unit = "V", cond = "receiver reads space (0)", verified = true },
  { param = "VIL", min = -15.0, max = -3.0, unit = "V", cond = "receiver reads mark (1)", verified = true },
  { param = "VBUS", desc = "voltage at the connector pins", min = -25.0, max = 25.0, unit = "V", verified = true },
  { param = "RIN", min = 3.0, max = 7.0, unit = "kohm", cond = "receiver input impedance", verified = true },
  { param = "ROFF", desc = "driver power-off impedance", min = 300.0, unit = "ohm", verified = true },
  { param = "CL", desc = "load capacitance incl. the receiver input", max = 2500.0, unit = "pF", verified = true },
  { param = "VOH", min = 5.0, typ = 5.4, unit = "V", state = "TRS3232", cond = "RL = 3 kΩ to GND", verified = true, doc = "TI-SLLS812", loc = "6.6 Electrical Characteristics—Driver, p. 5" },
  { param = "VOL", typ = -5.4, max = -5.0, unit = "V", state = "TRS3232", cond = "RL = 3 kΩ to GND", verified = true, doc = "TI-SLLS812", loc = "6.6 Electrical Characteristics—Driver, p. 5" },
  { param = "VT+", typ = 1.5, max = 2.4, unit = "V", state = "TRS3232 at VCC = 3.3 V", verified = true, doc = "TI-SLLS812", loc = "6.7 Electrical Characteristics—Receiver, p. 6" },
  { param = "VT-", min = 0.6, typ = 1.2, unit = "V", state = "TRS3232 at VCC = 3.3 V", verified = true, doc = "TI-SLLS812", loc = "6.7 Electrical Characteristics—Receiver, p. 6" },
