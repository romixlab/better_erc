[family.i2c-hs]
name = "I²C High-speed mode (3.4 Mbit/s)"
group = "I2C"
kind = "open-drain"
standard = "UM10204 Rev. 7.0, Hs-mode"
source = { doc = "UM10204", loc = "Table 12, p. 46" }
supply = [
  { name = "VDD", min = 1.65, max = 5.5, verified = false, note = "UM10204 sets no VDD range (see i2c-sm)" },
]
level = [
  { param = "VIL", min = -0.5, max = "0.3*VDD", unit = "V", verified = true },
  { param = "VIH", min = "0.7*VDD", max = "VDD+0.5", unit = "V", verified = true },
  { param = "VHYS", min = "0.1*VDD", unit = "V", verified = true },
  { param = "VOL", min = 0.0, max = 0.4, unit = "V", iout_ma = 3.0, cond = "VDD > 2 V, SDAH, SDA, SCLH", verified = true },
  { param = "VOL", min = 0.0, max = "0.2*VDD", unit = "V", iout_ma = 3.0, cond = "VDD <= 2 V", verified = true },
  { param = "ICS", desc = "pull-up current of the SCLH current source, SCLH between 0.3*VDD and 0.7*VDD", min = 3.0, max = 12.0, unit = "mA", verified = true },
  { param = "II", max = 10.0, unit = "uA", cond = "VI between 0.1*VDD and 0.9*VDD", verified = true },
  { param = "CI", max = 10.0, unit = "pF", verified = true },
