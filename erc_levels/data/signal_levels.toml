  { name = "VCC", min = 1.71, max = 5.25, verified = true, doc = "ADI-DS2484", loc = "Electrical Characteristics, p. 2", note = "the DS2484 master's supply" },
]
level = [
  { param = "VIL", min = -0.3, max = 0.8, unit = "V", state = "slave DS18B20", verified = true, note = "at 4 mA sink; may have to be reduced to 0.5 V for a presence pulse under low-voltage parasite power (note 5)" },
  { param = "VIH", min = 2.2, max = 5.5, unit = "V", state = "slave DS18B20", cond = "local power; max: the lower of 5.5 V or VDD+0.3 V", verified = true },
  { param = "VIH", min = 3.0, max = 5.5, unit = "V", state = "slave DS18B20, parasite power", cond = "max: the lower of 5.5 V or VDD+0.3 V", verified = true },
  { param = "IOL", min = 4.0, unit = "mA", state = "slave DS18B20", cond = "VI/O = 0.4 V", verified = true },
  { param = "VIL", max = "0.2*VCC", unit = "V", state = "master DS2484", verified = true, doc = "ADI-DS2484", loc = "Electrical Characteristics, p. 2" },
  { param = "VIH", min = "0.6*VCC", unit = "V", state = "master DS2484", verified = true, doc = "ADI-DS2484", loc = "Electrical Characteristics, p. 2" },
  { param = "VOL", max = 0.2, unit = "V", iout_ma = 8.0, state = "master DS2484", verified = true, doc = "ADI-DS2484", loc = "Electrical Characteristics, p. 2" },
  { param = "RPU", desc = "weak pull-up resistor of the master, low range", min = 375.0, typ = 500.0, max = 815.0, unit = "ohm", state = "master DS2484", verified = true, doc = "ADI-DS2484", loc = "Electrical Characteristics, p. 2" },
  { param = "VIAPO", desc = "active pull-up on-threshold of the master", min = 0.6, typ = 0.95, max = 1.2, unit = "V", state = "master DS2484", verified = true, doc = "ADI-DS2484", loc = "Electrical Characteristics, p. 2" },
]
notes = "There is no 1-Wire electrical standard document; slaves and masters each define their own levels. A slave's thresholds are fixed TTL-like (0.8/2.2 V), a master's (DS2484) are fractions of its own VCC: a 1.8 V master reads a 5 V bus fine, but its 0.6*VCC VIH is above 2.2 V at VCC > 3.7 V."

# ---------------------------------------------------------------------------------------------------------
# SPI, UART: no levels of their own
# ---------------------------------------------------------------------------------------------------------

[family.spi]
name = "SPI"
group = "SPI"
kind = "no-levels"
source = { doc = "ADI-AD52-09", loc = "p. 1-3" }
notes = "SPI is a de facto interface (Motorola) without an electrical standard: the article describes its signals and the four clock modes, no voltages. SCLK, MOSI, MISO and CS run at the CMOS levels of the devices' I/O supply (the lvcmos/JESD8 families). MISO from several targets must be tri-stated when CS is high."

[family.uart-ttl]
name = "UART at logic levels (\"TTL serial\")"
group = "UART"
kind = "no-levels"
source = { doc = "TI-SLLA037", loc = "Figure 3, p. 3 (PDF p. 8)" }
notes = "A UART's TX/RX at logic level has no standard of its own: the levels are the I/O supply's CMOS levels (lvcmos/JESD8 families), idle high (mark = logic 1). The TIA-232 figure shows TTL/CMOS logic on both sides of the RS-232 driver and receiver, which invert: logic 1 (mark) is the negative line voltage."

