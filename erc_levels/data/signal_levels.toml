]
notes = "Inverted logic: space (0) is positive, mark (1, idle) negative. The ±3 V receiver window is the standard's guarantee; real receivers switch between +0.6 V and +2.4 V (TRS3232), so an open or grounded input reads as mark, and a 0..3.3 V logic signal into an RS-232 receiver toggles it. Slew rate 30 V/µs max. Load capacitance replaced the 15 m cable length of RS-232-C."

