# Signal-level database of better_erc (crate erc_levels): what each logic family, bus and differential
# standard defines for its levels, each value with the document it was read from.
#
# Format (schema 1):
#
# [docs.ID]                one source document; ID is used by `source.doc` and `doc`
#   title, publisher, number, rev, date, url
#   library                the file in the technical library, relative to ~/sync; absent: not fetched
#   kind                   standard | harmonised-standard | appnote | datasheet
#   substitute_for         the standard a substitute stands in for (JEITA for JEDEC, a transceiver for TIA-485)
#
# [family.ID]              one family or standard in one supply variant (74lvc-3v3, 74lvc-1v8)
#   name, group            display name; the family the variants belong to
#   kind                   single-ended | open-drain | differential | bus | no-levels
#   standard               the standard's own name and number
#   source = { doc, loc }  the default source of every value below; loc: section, table, page. Pages are
#                          the PDF's own page numbers (the first page of the file is p. 1), which can
#                          differ from the number printed on the page
#   temp_c = [lo, hi]      ambient range the values hold over
#   supply = [ { name, min, typ, max, verified, loc, doc, note }, ... ]
#                          supplies and references in order; the first is the main supply; later ones
#                          may refer to earlier ones (VREF = "0.5*VDDQ")
#   termination = { kind, r_ohm, to, verified, doc, loc, note }
#   level = [ { param, min, typ, max, unit, state, vsupply, iout_ma, temp_c, t_c, cond, verified, doc, loc,
#               note, desc }, ... ]
#   see                    related families; notes: free text
#
# A limit is a number in the row's unit, or a linear expression of a supply in volts: "0.7*VDD",
# "VDD-0.4", "VCC-1.025", "VREF+0.1" (unit must then be V). iout_ma is the output test current with
# JEDEC's sign: positive into the pin, so an IOH test is negative. vsupply: the main supply the row is
# specified at; t_c: the one temperature it is specified at. Units: V mV Vppd mVppd A mA uA nA ohm
# kohm pF nF.
#
# verified = true only when the number was read from the named document at the named location. Anything
# from memory, a secondary source or an inference stays verified = false with a note saying why.
#
# Parameters: VIH VIL VT+ VT- VHYS VOH VOL IIH IIL II IOZ IOH IOL IOS CI; differential VOD dVOD VOS dVOS
# VTH VTL VID VIC VCM RIN RTERM; others need a desc (their first letter gives the dimension).

schema = 1

# ---------------------------------------------------------------------------------------------------------
# Documents
# ---------------------------------------------------------------------------------------------------------

[docs.UM10204]
title = "I2C-bus specification and user manual"
publisher = "NXP"
number = "UM10204"
rev = "7.0"
date = "2021-10-01"
url = "https://www.nxp.com/docs/en/user-guide/UM10204.pdf"
library = "design/Standards/UM10204.pdf"
kind = "standard"

# ---------------------------------------------------------------------------------------------------------
# I2C (UM10204)
# ---------------------------------------------------------------------------------------------------------

[family.i2c-sm]
name = "I²C Standard-mode (100 kbit/s)"
group = "I2C"
kind = "open-drain"
standard = "UM10204 Rev. 7.0, Standard-mode"
source = { doc = "UM10204", loc = "Table 10, p. 43" }
supply = [
  { name = "VDD", min = 1.65, max = 5.5, verified = false, note = "UM10204 sets no VDD range: it splits VOL at VDD = 2 V and caps VIH at VDD(max)+0.5 V or 5.5 V (Table 10 note 2); 1.65 V is the lowest VDD of common parts" },
]
level = [
  { param = "VIL", min = -0.5, max = "0.3*VDD", unit = "V", verified = true, note = "some legacy Standard-mode parts have fixed VIL = 1.5 V, VIH = 3.0 V (note 1)" },
  { param = "VIH", min = "0.7*VDD", max = "VDD+0.5", unit = "V", verified = true, note = "max: VDD(max)+0.5 V or 5.5 V, whichever is lower (note 2)" },
  { param = "VOL", min = 0.0, max = 0.4, unit = "V", iout_ma = 3.0, cond = "VDD > 2 V, open drain", verified = true },
  { param = "IOL", min = 3.0, unit = "mA", cond = "VOL = 0.4 V", verified = true },
  { param = "II", min = -10.0, max = 10.0, unit = "uA", cond = "0.1*VDD < VI < 0.9*VDDmax", verified = true },
  { param = "CI", max = 10.0, unit = "pF", verified = true },
  { param = "VnL", desc = "noise margin at the LOW level, each device incl. hysteresis", min = "0.1*VDD", unit = "V", verified = true, loc = "Table 11, p. 44" },
  { param = "VnH", desc = "noise margin at the HIGH level, each device incl. hysteresis", min = "0.2*VDD", unit = "V", verified = true, loc = "Table 11, p. 44" },
]
notes = "Standard-mode requires no input hysteresis (Vhys is n/a) and defines no VOL for VDD <= 2 V. Bus capacitance up to 400 pF (Table 11)."

[family.i2c-fm]
name = "I²C Fast-mode (400 kbit/s)"
group = "I2C"
kind = "open-drain"
standard = "UM10204 Rev. 7.0, Fast-mode"
source = { doc = "UM10204", loc = "Table 10, p. 43" }
supply = [
  { name = "VDD", min = 1.65, max = 5.5, verified = false, note = "UM10204 sets no VDD range (see i2c-sm)" },
]
level = [
  { param = "VIL", min = -0.5, max = "0.3*VDD", unit = "V", verified = true },
  { param = "VIH", min = "0.7*VDD", max = "VDD+0.5", unit = "V", verified = true, note = "max: VDD(max)+0.5 V or 5.5 V, whichever is lower" },
  { param = "VHYS", min = "0.05*VDD", unit = "V", verified = true },
  { param = "VOL", min = 0.0, max = 0.4, unit = "V", iout_ma = 3.0, cond = "VDD > 2 V, open drain", verified = true },
  { param = "VOL", min = 0.0, max = "0.2*VDD", unit = "V", iout_ma = 2.0, cond = "VDD <= 2 V, open drain", verified = true },
  { param = "IOL", min = 3.0, unit = "mA", cond = "VOL = 0.4 V", verified = true },
  { param = "IOL", min = 6.0, unit = "mA", cond = "VOL = 0.6 V; needed to drive 400 pF at 400 kHz (note 4)", verified = true },
  { param = "II", min = -10.0, max = 10.0, unit = "uA", cond = "0.1*VDD < VI < 0.9*VDDmax", verified = true },
  { param = "CI", max = 10.0, unit = "pF", verified = true },
  { param = "VnL", desc = "noise margin at the LOW level", min = "0.1*VDD", unit = "V", verified = true, loc = "Table 11, p. 44" },
  { param = "VnH", desc = "noise margin at the HIGH level", min = "0.2*VDD", unit = "V", verified = true, loc = "Table 11, p. 44" },
]
notes = "Inputs filter spikes below 50 ns. An unpowered Fast-mode device must not load the bus (note 9). Bus capacitance up to 400 pF."

