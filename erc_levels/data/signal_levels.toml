  { param = "CI", max = 8.0, unit = "pF", state = "all except MDIO", verified = true, loc = "22.4.4.3, p. 40" },
  { param = "CI", max = 10.0, unit = "pF", state = "MDIO", verified = true, loc = "22.4.4.3, p. 40" },
]
