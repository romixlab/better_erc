[family.cml]
name = "CML (current-mode logic), 3.3 V"
group = "CML"
kind = "differential"
source = { doc = "TI-SCAA059C", loc = "Tables 1 and 2, p. 3" }
supply = [
  { name = "VCC", min = 2.97, typ = 3.3, max = 3.63, verified = true, note = "Table 1 note 2: VCC = 3.3 V +/-10 %" },
]
termination = { kind = "50 ohm to VCC on each line at the receiver (often on-chip)", r_ohm = 50.0, to = "VCC", verified = true, doc = "Renesas-AN-891", loc = "p. 6", note = "'CML uses termination resistors connected to VDD at the receiver input'" }
level = [
  { param = "VOH", min = "VCC", unit = "V", verified = true, note = "typical, not a limit: SCAA059 calls its tables 'Typical'" },
  { param = "VOL", max = "VCC-0.4", unit = "V", verified = true, note = "typical" },
  { param = "VIH", min = "VCC", unit = "V", verified = true, note = "typical" },
  { param = "VCM", typ = "VCC-0.2", unit = "V", cond = "input common mode", verified = true },
  { param = "VIL", max = "VCC-0.4", unit = "V", verified = true, note = "typical" },
  { param = "VID", min = 400.0, unit = "mV", verified = true },
  { param = "VSWING", desc = "single-ended swing at each input", typ = 400.0, unit = "mV", cond = "VDD 3.3, 2.5 or 1.8 V", verified = true, doc = "Renesas-AN-891", loc = "Driving CML, p. 6" },
]
notes = "CML conforms to no standard (SNLA187 p. 9, SCAA059 p. 3): levels vary by vendor and are usually AC coupled. These are TI's typical 3.3 V CML values; FPGA transceivers run CML from 1.0-1.5 V supplies with their own limits."

[family.hcsl]
name = "HCSL (PCIe reference clock levels), traditional current-steering driver"
group = "HCSL"
kind = "differential"
standard = "PCI Express CEM reference clock (as reproduced in clock datasheets)"
source = { doc = "Renesas-AN-879", loc = "p. 1" }
temp_c = [-40.0, 85.0]
termination = { kind = "50 ohm to ground on each line, at the end of the line or at the source; the driver steers 15 mA", r_ohm = 50.0, to = 0.0, verified = true, loc = "p. 1 and Figure 5, p. 3" }
see = ["lp-hcsl"]
level = [
  { param = "VOH", desc = "VHIGH, statistical single-ended high level", min = 660.0, typ = 790.0, max = 850.0, unit = "mV", verified = true, doc = "Renesas-R31DS0112EU0108", loc = "Table 7, p. 13" },
  { param = "VOL", desc = "VLOW", min = -150.0, typ = -4.0, max = 150.0, unit = "mV", verified = true, doc = "Renesas-R31DS0112EU0108", loc = "Table 7, p. 13" },
  { param = "VCROSS", desc = "absolute crossing voltage", min = 250.0, max = 550.0, unit = "mV", verified = true, doc = "Renesas-R31DS0112EU0108", loc = "Table 7, p. 12" },
  { param = "dVCROSS", desc = "total variation of the crossing voltage", max = 140.0, unit = "mV", verified = true, doc = "Renesas-R31DS0112EU0108", loc = "Table 7, p. 12" },
  { param = "VMAXABS", desc = "absolute maximum single-ended voltage incl. overshoot", max = 1150.0, unit = "mV", verified = true, doc = "Renesas-R31DS0112EU0108", loc = "Table 7, p. 13" },
  { param = "VMINABS", desc = "absolute minimum single-ended voltage incl. undershoot", min = -300.0, unit = "mV", verified = true, doc = "Renesas-R31DS0112EU0108", loc = "Table 7, p. 13" },
  { param = "VTH", max = 150.0, unit = "mV", verified = false, note = "PCIe CEM receiver: differential +/-150 mV, the window rise and fall are measured in (9FGL Table 7 note 2); the CEM spec itself is members-only" },
  { param = "VTL", min = -150.0, unit = "mV", verified = false, note = "as VTH" },
]
notes = "AN-879: an HCSL receiver cannot tell a traditional HCSL driver from an LP-HCSL one, so both share these levels (read from Renesas' 9FGL LP-HCSL table, which states the PCIe limits). The datasheet swaps the symbols: 'VMIN' is the absolute maximum and 'VMAX' the absolute minimum."

[family.lp-hcsl]
name = "LP-HCSL (low-power push-pull HCSL)"
group = "HCSL"
kind = "differential"
source = { doc = "Renesas-R31DS0112EU0108", loc = "Table 7, pp. 12-13" }
temp_c = [-40.0, 85.0]
supply = [
  { name = "VDDIO", min = 0.9975, max = 3.465, verified = true, loc = "Table 6, p. 12", note = "supply of the differential outputs; typ 1.05-3.3 V" },
]
termination = { kind = "none to ground: 50 ohm source impedance (or 33 ohm series on 17 ohm drivers), high-impedance receiver", verified = true, doc = "Renesas-AN-879", loc = "Figure 6, p. 4" }
see = ["hcsl"]
level = [
  { param = "VOH", desc = "VHIGH", min = 660.0, typ = 790.0, max = 850.0, unit = "mV", verified = true, loc = "Table 7, p. 13" },
  { param = "VOL", desc = "VLOW", min = -150.0, typ = -4.0, max = 150.0, unit = "mV", verified = true, loc = "Table 7, p. 13" },
  { param = "VCROSS", desc = "absolute crossing voltage", min = 250.0, typ = 429.0, max = 550.0, unit = "mV", verified = true, loc = "Table 7, p. 12" },
  { param = "dVCROSS", desc = "total crossing-voltage variation", max = 140.0, unit = "mV", verified = true, loc = "Table 7, p. 12" },
]
notes = "LP-HCSL drives 0-0.8 V with a push-pull stage source-terminated to 50 ohm: about 4-5 mA per pair instead of 15 mA, and no resistors to ground (AN-879). It can drive LVDS, LVPECL and CML inputs through a passive network (AN-891). DC-coupled to an input with 100 ohm differential termination it gives about half the swing."

