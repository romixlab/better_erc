[package]
name = "erc_parts"
description = "better_erc part data: the parts snapshot (parts.lock.toml) the checks read, the part sources a refresh asks"
authors.workspace = true
edition.workspace = true
version.workspace = true
rust-version.workspace = true
include.workspace = true

[dependencies]
erc_model = { path = "../erc_model" }
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "display", "serde"] }

[dev-dependencies]
erc_kicad = { path = "../erc_kicad" }
