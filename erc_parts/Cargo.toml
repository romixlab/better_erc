[package]
name = "erc_parts"
description = "better_erc part data: the parts snapshot (parts.lock.toml) the checks read, the part sources a refresh asks"
authors.workspace = true
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
include.workspace = true

[features]
# The mx3 part store as a part source (`mx3::Mx3Source`): its HTTP client, reqwest with rustls
mx3 = ["dep:anyhow", "dep:mx3_api_lab", "mx3_api_lab/client"]

[dependencies]
anyhow = { version = "1.0", optional = true }
erc_model = { path = "../erc_model" }
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "display", "serde"] }
mx3_api_lab = { git = "https://github.com/vhrdtech/mx3_api", default-features = false, optional = true }
# The mx3: datasheet link reader (`datasheet_link`): types and parsing only, no HTTP client
mx3_api_core = { git = "https://github.com/vhrdtech/mx3_api", default-features = false }

[dev-dependencies]
erc_fake_mx3 = { path = "../erc_fake_mx3" }
erc_kicad = { path = "../erc_kicad" }
serde_json = "1"
