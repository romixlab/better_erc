[package]
name = "erc_analysis"
description = "better_erc analyses over the board model: part classes, values, graph queries, bus recognisers"
authors.workspace = true
edition.workspace = true
version.workspace = true
rust-version.workspace = true
include.workspace = true

[dependencies]
erc_model = { path = "../erc_model" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
erc_kicad = { path = "../erc_kicad" }
erc_model = { path = "../erc_model", features = ["fs"] }
toml = "1"
